<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>爱心粒子圣诞树</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #1a2b48 0%, #0b1428 45%, #050a16 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  .title {
    position: fixed;
    left: 0; right: 0; bottom: 26px;
    text-align: center;
    color: #eef6ff;
    letter-spacing: 6px;
    font-size: 18px;
    text-shadow: 0 0 18px rgba(200, 230, 255, .8);
    pointer-events: none;
    user-select: none;
  }
  .tip {
    position: fixed;
    top: 18px; right: 22px;
    color: rgba(210, 230, 255, .55);
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  }
  #msg {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: #ffd8d8; font-size: 16px; text-align: center;
    padding: 30px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="canvas-wrap"></div>
<div class="title">MERRY CHRISTMAS</div>
<div class="tip">拖动环绕观察 · 滚轮缩放</div>
<div id="msg">当前浏览器无法启用 WebGL，请更换浏览器后重试。</div>

<script type="module">
import * as THREE from 'three';

/* ===================== 基础场景 ===================== */
const wrap = document.getElementById('canvas-wrap');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  document.getElementById('msg').style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x081226, 0.018);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
let camDist = 12.8;                 // 相机距离，滚轮可调
camera.position.set(0, 0.4, camDist);
camera.lookAt(0, 0, 0);

const treeGroup = new THREE.Group();
scene.add(treeGroup);

/* ===================== 爱心几何体 ===================== */
const heartShape = new THREE.Shape();
const hx = 0, hy = 0;
heartShape.moveTo(hx + 0.5, hy + 0.5);
heartShape.bezierCurveTo(hx + 0.5, hy + 0.5, hx + 0.4, hy, hx, hy);
heartShape.bezierCurveTo(hx - 0.6, hy, hx - 0.6, hy + 0.7, hx - 0.6, hy + 0.7);
heartShape.bezierCurveTo(hx - 0.6, hy + 1.1, hx - 0.3, hy + 1.54, hx + 0.5, hy + 1.9);
heartShape.bezierCurveTo(hx + 1.2, hy + 1.54, hx + 1.6, hy + 1.1, hx + 1.6, hy + 0.7);
heartShape.bezierCurveTo(hx + 1.6, hy + 0.7, hx + 1.6, hy, hx + 1, hy);
heartShape.bezierCurveTo(hx + 0.7, hy, hx + 0.5, hy + 0.5, hx + 0.5, hy + 0.5);

const heartGeo = new THREE.ShapeGeometry(heartShape, 6);
heartGeo.center();
heartGeo.computeBoundingBox();
const bb = heartGeo.boundingBox;
const hh = bb.max.y - bb.min.y;
heartGeo.scale(1 / hh, 1 / hh, 1 / hh); // 归一化到高度 1

/* ===================== 九层爱心粒子树身 ===================== */
const TIERS = 9;
const TIER_H = 0.60;
const TREE_BOTTOM = -3.0;
const R_MAX = 3.0;

const particles = [];
const rimParticles = [];

for (let t = 0; t < TIERS; t++) {
  const baseY = TREE_BOTTOM + t * TIER_H;
  const rBase = R_MAX * (1 - t / 9.6);
  const rTop = rBase * 0.5;
  const count = Math.floor(320 + rBase * 430);

  for (let i = 0; i < count; i++) {
    const f = Math.random();                       // 层内高度比例
    const y = baseY + f * TIER_H;
    const radius = rBase + (rTop - rBase) * f;
    const theta = Math.random() * Math.PI * 2;
    const rr = radius * Math.sqrt(Math.random());  // 面积均匀，填充饱满
    particles.push({
      x: Math.cos(theta) * rr,
      y: y + (Math.random() - 0.5) * 0.04,
      z: Math.sin(theta) * rr,
      theta,
      tier: t,
      size: 0.055 + Math.random() * 0.055,
      tilt: (Math.random() - 0.5) * 0.7,
      phase: Math.random() * Math.PI * 2
    });
  }

  // 每层底部加一圈亮银白「裙边」，强化层次感
  const rimCount = Math.floor(rBase * 120);
  for (let i = 0; i < rimCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    rimParticles.push({
      x: Math.cos(theta) * rBase * (0.96 + Math.random() * 0.08),
      y: baseY + Math.random() * 0.06,
      z: Math.sin(theta) * rBase * (0.96 + Math.random() * 0.08),
      theta,
      tier: t,
      size: 0.08 + Math.random() * 0.05,
      tilt: (Math.random() - 0.5) * 0.4,
      phase: Math.random() * Math.PI * 2
    });
  }
}

const total = particles.length + rimParticles.length;
const allParticles = particles.concat(rimParticles);

const heartMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
const hearts = new THREE.InstancedMesh(heartGeo, heartMat, total);
hearts.instanceMatrix.setUsage(THREE.StaticDrawUsage);
treeGroup.add(hearts);

const dummy = new THREE.Object3D();
const color = new THREE.Color();

function particleColor(p, isRim) {
  if (isRim) {
    // 亮银白裙边
    return color.setHSL(0.56 + Math.random() * 0.04, 0.20 + Math.random() * 0.18, 0.86 + Math.random() * 0.12);
  }
  const r = Math.random();
  if (r < 0.06) return color.setHSL(0.55, 0.55, 0.80 + Math.random() * 0.12);   // 冰蓝点缀
  if (r < 0.10) return color.setHSL(0.72, 0.35, 0.82 + Math.random() * 0.10);   // 淡紫银点缀
  const light = 0.55 + (p.tier / 9) * 0.22 + Math.random() * 0.16;              // 下银灰上亮白
  return color.setHSL(0.56 + Math.random() * 0.06, 0.12 + Math.random() * 0.22, Math.min(light, 0.97)); // 银白
}

allParticles.forEach((p, i) => {
  dummy.position.set(p.x, p.y, p.z);
  dummy.rotation.set(p.tilt, Math.PI / 2 - p.theta, p.tilt * 0.5);
  dummy.scale.setScalar(p.size);
  dummy.updateMatrix();
  hearts.setMatrixAt(i, dummy.matrix);
  hearts.setColorAt(i, particleColor(p, i >= particles.length));
});
hearts.instanceMatrix.needsUpdate = true;
if (hearts.instanceColor) hearts.instanceColor.needsUpdate = true;

/* ===================== 树顶银白爱心 ===================== */
function heartTopTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 24, 0, 232);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.5, '#f3e6ff');
  g.addColorStop(1, '#c9d8f5');
  ctx.save();
  ctx.translate(128, 132);
  ctx.scale(7.6, -7.6);
  ctx.shadowColor = 'rgba(220,200,255,0.95)';
  ctx.shadowBlur = 3;
  ctx.beginPath();
  for (let i = 0; i <= 220; i++) {
    const t = (i / 220) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 0.35;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.stroke();
  ctx.restore();
  return new THREE.CanvasTexture(c);
}

function radialTexture(inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner);
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

const star = new THREE.Sprite(new THREE.SpriteMaterial({
  map: heartTopTexture(), transparent: true, depthWrite: false
}));
star.position.set(0, 2.85, 0);
star.scale.set(1.25, 1.25, 1);
treeGroup.add(star);

const starGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTexture('rgba(225,200,255,0.8)', 'rgba(190,170,255,0)'),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
starGlow.scale.set(2.6, 2.6, 1);
treeGroup.add(starGlow);

/* ===================== 雪花贴图 ===================== */
function snowflakeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.translate(64, 64);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#9fdcff';
  ctx.shadowBlur = 8;
  for (let i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-11, -34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(11, -34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -37); ctx.lineTo(-7, -45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -37); ctx.lineTo(7, -45); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  return new THREE.CanvasTexture(c);
}
const flakeTex = snowflakeTexture();

/* ===================== 枝头点缀雪花（会随树旋转、闪烁） ===================== */
const adornCount = 260;
const adornGeo = new THREE.BufferGeometry();
const adornPos = new Float32Array(adornCount * 3);
const adornPhase = new Float32Array(adornCount);
const adornSize = new Float32Array(adornCount);
for (let i = 0; i < adornCount; i++) {
  const t = Math.floor(Math.random() * TIERS);
  const baseY = TREE_BOTTOM + t * TIER_H;
  const radius = R_MAX * (1 - t / 9.6);
  const theta = Math.random() * Math.PI * 2;
  const rr = radius * (0.85 + Math.random() * 0.2);
  adornPos[i * 3] = Math.cos(theta) * rr;
  adornPos[i * 3 + 1] = baseY + Math.random() * TIER_H;
  adornPos[i * 3 + 2] = Math.sin(theta) * rr;
  adornPhase[i] = Math.random() * Math.PI * 2;
  adornSize[i] = 8 + Math.random() * 10;
}
adornGeo.setAttribute('position', new THREE.BufferAttribute(adornPos, 3));
adornGeo.setAttribute('aPhase', new THREE.BufferAttribute(adornPhase, 1));
adornGeo.setAttribute('aSize', new THREE.BufferAttribute(adornSize, 1));

const adornMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uTex: { value: flakeTex },
    uPR: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float aPhase;
    attribute float aSize;
    uniform float uTime;
    uniform float uPR;
    varying float vA;
    void main() {
      vA = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * 2.2 + aPhase));
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPR * (12.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vA;
    void main() {
      vec4 t = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(t.rgb, t.a * vA);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
treeGroup.add(new THREE.Points(adornGeo, adornMat));

/* ===================== 从天空落下的闪亮小雪花 ===================== */
const SNOW = 900;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW * 3);
const snowSpeed = new Float32Array(SNOW);
const snowPhase = new Float32Array(SNOW);
for (let i = 0; i < SNOW; i++) {
  snowPos[i * 3] = (Math.random() - 0.5) * 24;
  snowPos[i * 3 + 1] = Math.random() * 18 - 4;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
  snowSpeed[i] = 0.6 + Math.random() * 1.1;
  snowPhase[i] = Math.random() * Math.PI * 2;
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
snowGeo.setAttribute('aPhase', new THREE.BufferAttribute(snowPhase, 1));
const snowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uTex: { value: flakeTex },
    uPR: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float aPhase;
    uniform float uTime;
    uniform float uPR;
    varying float vA;
    void main() {
      float s = 0.5 + 0.5 * sin(uTime * 3.4 + aPhase);
      vA = 0.3 + 0.7 * pow(s, 2.0);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = (9.0 + 5.0 * vA) * uPR * (12.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vA;
    void main() {
      vec4 t = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(t.rgb, t.a * vA);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
scene.add(new THREE.Points(snowGeo, snowMat));

/* ===================== 从天空落下的闪亮心型粒子 ===================== */
function heartParticleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.translate(64, 68);
  ctx.scale(3.1, -3.1);
  ctx.shadowColor = 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = 3;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = (i / 200) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  return new THREE.CanvasTexture(c);
}
const heartPTex = heartParticleTexture();

const HEARTS = 150;
const hpGeo = new THREE.BufferGeometry();
const hpPos = new Float32Array(HEARTS * 3);
const hpSpeed = new Float32Array(HEARTS);
const hpPhase = new Float32Array(HEARTS);
const hpSize = new Float32Array(HEARTS);
const hpColor = new Float32Array(HEARTS * 3);
const hpPalette = [
  [1.00, 0.62, 0.78], // 粉
  [1.00, 0.78, 0.86], // 浅粉
  [0.90, 0.95, 1.00]  // 银白
];
for (let i = 0; i < HEARTS; i++) {
  hpPos[i * 3] = (Math.random() - 0.5) * 24;
  hpPos[i * 3 + 1] = Math.random() * 18 - 4;
  hpPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
  hpSpeed[i] = 0.5 + Math.random() * 0.9;
  hpPhase[i] = Math.random() * Math.PI * 2;
  hpSize[i] = 10 + Math.random() * 8;
  const tint = hpPalette[Math.floor(Math.random() * hpPalette.length)];
  hpColor[i * 3] = tint[0]; hpColor[i * 3 + 1] = tint[1]; hpColor[i * 3 + 2] = tint[2];
}
hpGeo.setAttribute('position', new THREE.BufferAttribute(hpPos, 3));
hpGeo.setAttribute('aPhase', new THREE.BufferAttribute(hpPhase, 1));
hpGeo.setAttribute('aSize', new THREE.BufferAttribute(hpSize, 1));
hpGeo.setAttribute('aColor', new THREE.BufferAttribute(hpColor, 3));
const hpMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uTex: { value: heartPTex },
    uPR: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float aPhase;
    attribute float aSize;
    attribute vec3 aColor;
    uniform float uTime;
    uniform float uPR;
    varying float vA;
    varying vec3 vColor;
    void main() {
      float s = 0.5 + 0.5 * sin(uTime * 2.6 + aPhase);
      vA = 0.35 + 0.65 * pow(s, 2.0);
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (0.7 + 0.5 * vA) * uPR * (12.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vA;
    varying vec3 vColor;
    void main() {
      vec4 t = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(t.rgb * vColor, t.a * vA);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
scene.add(new THREE.Points(hpGeo, hpMat));

/* ===================== 树下多层闪亮粒子光环 ===================== */
function sparkleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.translate(64, 64);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 42);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.22, 'rgba(226,242,255,0.7)');
  g.addColorStop(1, 'rgba(170,215,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-48, 0); ctx.lineTo(48, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(0, 48); ctx.stroke();
  return new THREE.CanvasTexture(c);
}
const sparkTex = sparkleTexture();

const RINGS = 18;                 // 光环圈数，扩展铺满底部区域
const ringPoints = [];
for (let ring = 0; ring < RINGS; ring++) {
  const radius = 0.45 + ring * 0.50; // 圈间距 0.50，最外圈约 8.95
  const n = 80 + ring * 46;
  const y = TREE_BOTTOM - 0.06 - radius * 0.01;
  // 粉色 / 银白色板，光环中粉色与银白交替混搭
  const palette = [
    [1.00, 0.55, 0.72], // 粉红
    [1.00, 0.72, 0.82], // 浅粉
    [1.00, 0.45, 0.63], // 玫粉
    [0.86, 0.94, 1.00], // 冰银白
    [1.00, 1.00, 1.00]  // 亮白
  ];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.012;
    const pick = Math.random();
    const tint = pick < 0.42 ? palette[Math.floor(Math.random() * 3)]
                             : palette[3 + Math.floor(Math.random() * 2)];
    ringPoints.push({
      x: Math.cos(a) * radius,
      y: y + (Math.random() - 0.5) * 0.02,
      z: Math.sin(a) * radius,
      phase: Math.random() * Math.PI * 2,
      size: 5 + Math.random() * 7,
      ring: ring,
      color: tint
    });
  }
}

const ringGeo = new THREE.BufferGeometry();
const ringPos = new Float32Array(ringPoints.length * 3);
const ringColor = new Float32Array(ringPoints.length * 3);
const ringPhase = new Float32Array(ringPoints.length);
const ringSize = new Float32Array(ringPoints.length);
const ringIdx = new Float32Array(ringPoints.length);
ringPoints.forEach((p, i) => {
  ringPos[i * 3] = p.x; ringPos[i * 3 + 1] = p.y; ringPos[i * 3 + 2] = p.z;
  ringColor[i * 3] = p.color[0]; ringColor[i * 3 + 1] = p.color[1]; ringColor[i * 3 + 2] = p.color[2];
  ringPhase[i] = p.phase; ringSize[i] = p.size; ringIdx[i] = p.ring;
});
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
ringGeo.setAttribute('aColor', new THREE.BufferAttribute(ringColor, 3));
ringGeo.setAttribute('aPhase', new THREE.BufferAttribute(ringPhase, 1));
ringGeo.setAttribute('aSize', new THREE.BufferAttribute(ringSize, 1));
ringGeo.setAttribute('aRing', new THREE.BufferAttribute(ringIdx, 1));

const ringMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uTex: { value: sparkTex },
    uPR: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float aPhase;
    attribute float aSize;
    attribute float aRing;
    attribute vec3 aColor;
    uniform float uTime;
    uniform float uPR;
    varying float vA;
    varying vec3 vColor;
    void main() {
      // 每圈自转，内快外慢，相邻圈反向
      float speed = (0.35 - aRing * 0.02) * (mod(aRing, 2.0) < 1.0 ? 1.0 : -1.0);
      float ang = uTime * speed;
      float c = cos(ang), s = sin(ang);
      vec3 p = vec3(position.x * c - position.z * s, position.y, position.x * s + position.z * c);
      vA = 0.25 + 0.75 * (0.5 + 0.5 * sin(uTime * 3.2 + aPhase));
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * (0.7 + 0.6 * vA) * uPR * (12.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vA;

function clusterPos() {
  if (Math.random() < 0.82) {
    const c = clusters[Math.floor(Math.random() * clusters.length)];
    const g1 = (Math.random() + Math.random() + Math.random() - 1.5) * 1.3;
    const g2 = (Math.random() + Math.random() + Math.random() - 1.5) * 1.3;
    return { x: c.x + g1, z: c.z + g2 };
  }
  const rr = 9 * Math.sqrt(Math.random());
  const a = Math.random() * Math.PI * 2;
  return { x: Math.cos(a) * rr, z: Math.sin(a) * rr };
}

/* ===================== 交互：拖动旋转 / 滚轮缩放 ===================== */
let dragging = false, lastX = 0, lastY = 0, orbitYaw = 0, orbitPitch = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  orbitYaw -= (e.clientX - lastX) * 0.006;          // 水平环绕
  orbitPitch += (e.clientY - lastY) * 0.006;         // 上下俯仰
  orbitPitch = Math.max(-1.25, Math.min(1.25, orbitPitch)); // 限制在 ±72°，避免翻转
  lastX = e.clientX;
  lastY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.008, 7, 20);
}, { passive: false });

/* ===================== 动画循环 ===================== */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // 画面缓慢自动移动 + 拖动全方位观察（水平环绕 yaw + 上下俯仰 pitch）
  const yaw = Math.sin(elapsed * 0.09) * 0.28 + orbitYaw;
  const pitch = Math.max(-1.25, Math.min(1.25, 0.03 + orbitPitch + Math.sin(elapsed * 0.22) * 0.03));
  const horiz = Math.cos(pitch) * camDist;
  camera.position.x = Math.sin(yaw) * horiz;
  camera.position.z = Math.cos(yaw) * horiz;
  camera.position.y = Math.sin(pitch) * camDist + 0.1;
  camera.lookAt(0, 0.1, 0);

  treeGroup.rotation.y = elapsed * 0.22;
  treeGroup.rotation.z = Math.sin(elapsed * 0.6) * 0.012;
  star.position.y = 2.85 + Math.sin(elapsed * 1.6) * 0.07;
  star.material.rotation = Math.sin(elapsed * 0.9) * 0.12; // 轻微摆动
  starGlow.position.y = star.position.y;
  starGlow.scale.setScalar(2.5 + Math.sin(elapsed * 2.0) * 0.25);

  adornMat.uniforms.uTime.value = elapsed;
  ringMat.uniforms.uTime.value = elapsed;
  bgMat.uniforms.uTime.value = elapsed;
  dotMat.uniforms.uTime.value = elapsed;
  fillMat.uniforms.uTime.value = elapsed;
  petalMat.uniforms.uTime.value = elapsed;
  snowDecoMat.uniforms.uTime.value = elapsed;
  spMat.uniforms.uTime.value = elapsed;
  ssMat.uniforms.uTime.value = elapsed;
  snowMat.uniforms.uTime.value = elapsed;
  hpMat.uniforms.uTime.value = elapsed;

  for (let i = 0; i < SNOW; i++) {
    const iy = i * 3 + 1;
    snowPos[iy] -= snowSpeed[i] * dt;
    snowPos[i * 3] += Math.sin(elapsed * 0.8 + i) * 0.003;
    if (snowPos[iy] < -4.6) {
      snowPos[iy] = 13 + Math.random() * 3;
      snowPos[i * 3] = (Math.random() - 0.5) * 24;
      snowPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  // 花瓣在下方缓慢飘落、左右摇摆
  for (let i = 0; i < PETALS; i++) {
    const iy = i * 3 + 1;
    petalPos[iy] -= petalSpeed[i] * dt;
    petalPos[i * 3] += Math.sin(elapsed * 0.9 + petalPhase[i]) * 0.008;
    if (petalPos[iy] < -4.3) {
      petalPos[iy] = 0.1 + Math.random() * 0.6;  // 从树下方重新飘落
      const rr = 9 * Math.sqrt(Math.random());
      const a = Math.random() * Math.PI * 2;
      petalPos[i * 3] = Math.cos(a) * rr;
      petalPos[i * 3 + 2] = Math.sin(a) * rr;
    }
  }
  petalGeo.attributes.position.needsUpdate = true;

  for (let i = 0; i < HEARTS; i++) {
    const iy = i * 3 + 1;
    hpPos[iy] -= hpSpeed[i] * dt;
    hpPos[i * 3] += Math.sin(elapsed * 1.1 + i) * 0.006; // 心形轻轻飘摆
    if (hpPos[iy] < -4.6) {
      hpPos[iy] = 13 + Math.random() * 3;
      hpPos[i * 3] = (Math.random() - 0.5) * 24;
      hpPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
    }
  }
  hpGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  adornMat.uniforms.uPR.value = renderer.getPixelRatio();
  ringMat.uniforms.uPR.value = renderer.getPixelRatio();
  bgMat.uniforms.uPR.value = renderer.getPixelRatio();
  dotMat.uniforms.uPR.value = renderer.getPixelRatio();
  fillMat.uniforms.uPR.value = renderer.getPixelRatio();
  petalMat.uniforms.uPR.value = renderer.getPixelRatio();
  snowDecoMat.uniforms.uPR.value = renderer.getPixelRatio();
  spMat.uniforms.uPR.value = renderer.getPixelRatio();
  ssMat.uniforms.uPR.value = renderer.getPixelRatio();
  snowMat.uniforms.uPR.value = renderer.getPixelRatio();
  hpMat.uniforms.uPR.value = renderer.getPixelRatio();
});
</script>
